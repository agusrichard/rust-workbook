[package]
name = "rust-grpc"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
prost = "0.14.4"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"

[build-dependencies]
tonic-prost-build = "0.14.6"
