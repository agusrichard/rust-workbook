[package]
name = "rust-graphql"
version = "0.1.0"
edition = "2024"

[dependencies]
async-graphql = "7.2.1"
async-graphql-axum = "7.2.1"
axum = "0.8.9"
dotenvy = "0.15.7"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net"] }
