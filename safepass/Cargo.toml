[package]
name = "safepass"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rpassword = "7.3"
pam = "0.7"
whoami = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
aes-gcm = "0.10.3"
sha2 = "0.10.8"
pbkdf2 = "0.12.2"
hmac = "0.12.1"
rand = "0.8.5"
base64 = "0.22.1"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"

