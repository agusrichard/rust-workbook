services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: todo_user
      POSTGRES_PASSWORD: todo_password
      POSTGRES_DB: todo_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo_user -d todo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgweb:
    image: sosedoff/pgweb
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgres://todo_user:todo_password@postgres:5432/todo_db?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    volumes:
      - .:/app
      - cargo-cache:/usr/local/cargo
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://todo_user:todo_password@postgres:5432/todo_db
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  cargo-cache:
